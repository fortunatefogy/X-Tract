name: linky
description: Share a webpage to detect, download, and manage public media.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.5
  video_player: ^2.9.5
  flutter_inappwebview: ^6.1.5
  background_downloader: ^9.5.9
  local_auth: ^2.3.0
  xml: ^6.5.0
  animated_splash_screen: ^1.3.0
  page_transition: ^2.2.2
  speech_to_text: ^7.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1
  path_provider_platform_interface: ^2.1.2

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/cropped_circle_image.png"
  min_sdk_android: 24
  adaptive_icon_background: "#0F1017"
  adaptive_icon_foreground: "assets/icon/cropped_circle_image.png"
  adaptive_icon_foreground_inset: 16

flutter_native_splash:
  color: "#0F1017"
  android: true
  ios: false
  android_12:
    color: "#0F1017"

flutter:
  uses-material-design: true
  assets:
    - assets/adblock/oisd_small.txt
    - assets/icon/cropped_circle_image.png
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Regular.ttf
          weight: 400
        - asset: assets/fonts/Outfit-Medium.ttf
          weight: 500
        - asset: assets/fonts/Outfit-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Outfit-Bold.ttf
          weight: 700
        - asset: assets/fonts/Outfit-ExtraBold.ttf
          weight: 800
